name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check server/

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt
          pip install bandit pip-audit
      - name: Security scan (bandit)
        run: bandit -r server/app/ -ll
      - name: Dependency audit
        run: pip-audit -r server/requirements.txt

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt
          pip install pytest pyyaml
      - name: Run tests
        run: |
          cd server
          if [ -d tests ] || find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            pytest --tb=short
          else
            echo "No tests found, skipping pytest."
          fi

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f server/Dockerfile .

  packaging:
    name: Packaging Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt
          pip install pytest pyyaml
      - name: Shell script syntax (bash -n)
        run: |
          for f in scripts/release/*.sh scripts/linux/*.sh scripts/check_spotiflac_update.sh; do
            bash -n "$f" && echo "OK: $f"
          done
      - name: YAML validation (workflows + compose)
        run: |
          python -c "
          import yaml, glob
          files = glob.glob('.github/workflows/*.yml') + ['docker-compose.yml', 'docker-compose.prod.yml']
          assert files, 'no workflow/compose files found'
          for f in files:
              yaml.safe_load(open(f))
              print('OK:', f)
          "
      - name: Packaging tests
        run: |
          cd server
          pytest tests/test_release_packaging.py --tb=short -q
      - name: Dry-run Linux bundle packaging
        run: |
          chmod +x scripts/release/*.sh scripts/linux/*.sh
          rm -rf dist && mkdir -p dist
          scripts/release/package-linux.sh --tag v0.0.0 --arch linux-amd64 --commit ci-dry-run --out dist
          scripts/release/package-linux.sh --tag v0.0.0 --arch linux-arm64 --commit ci-dry-run --out dist
          (cd dist && sha256sum openfy-*.tar.gz > SHA256SUMS && cat SHA256SUMS)
          scripts/release/validate-release.sh --tag v0.0.0 --dir dist --expect-commit ci-dry-run
